<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>منصة توثيقات الأحزاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --bg-dark: #0a0b10;
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-card: rgba(20, 24, 40, 0.75);
            --text-main: #ffffff;
            --text-muted: #a0a5ba;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background-color: var(--bg-dark);
            color: var(--text-main);
            width: 100%; height: 100%;
            overflow: hidden;
            position: relative;
        }

        .animated-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #16192b, #07080c);
        }

        .blob {
            position: absolute;
            width: 300px; height: 300px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: moveBlob 10s infinite alternate ease-in-out;
        }
        .blob-1 { top: -20px; right: -20px; }
        .blob-2 { bottom: -20px; left: -20px; animation-delay: -5s; }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.1); }
        }

        header {
            width: 100%; padding: 15px;
            text-align: center;
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: absolute; top: 0; z-index: 100;
        }

        header h2 {
            font-size: 18px; font-weight: 800;
            background: linear-gradient(45deg, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .swiper-wrapper {
            display: flex; width: 400vw; height: 100vh;
            transition: transform 0.3s ease-out;
            padding-top: 60px; padding-bottom: 80px;
        }

        .screen-slide {
            width: 100vw; height: calc(100vh - 140px);
            overflow-y: auto; padding: 15px; flex-shrink: 0;
        }

        .card {
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .card h3 {
            font-size: 16px; margin-bottom: 15px;
            display: flex; align-items: center; gap: 8px;
        }

        label {
            font-size: 12px; color: var(--text-muted);
            margin-bottom: 4px; display: block; text-align: right;
        }

        input {
            width: 100%; padding: 12px; margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px; color: #fff; font-size: 14px; outline: none;
        }

        input:focus { border-color: var(--primary); }

        .upload-area {
            border: 2px dashed var(--primary);
            background: rgba(108, 92, 231, 0.1);
            padding: 20px; border-radius: 14px;
            text-align: center; cursor: pointer;
            margin-bottom: 15px; position: relative;
        }

        .upload-area input[type=file] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #4834d4);
            color: white; border: none; padding: 12px;
            border-radius: 10px; font-weight: 700; font-size: 15px;
            cursor: pointer;
        }

        .img-preview {
            width: 100%; max-height: 220px; object-fit: cover;
            border-radius: 10px; margin-bottom: 12px; display: none;
        }

        .post-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 15px; margin-bottom: 15px;
        }

        .post-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }

        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; background-size: cover; background-position: center; overflow: hidden;
        }

        .post-party {
            background: rgba(0, 206, 201, 0.15);
            border: 1px solid var(--secondary);
            padding: 2px 8px; border-radius: 15px;
            font-size: 11px; color: var(--secondary);
        }

        .post-img { width: 100%; border-radius: 10px; margin-top: 8px; }

        .profile-avatar-container {
            position: relative; width: 85px; height: 85px; margin: 0 auto 15px auto;
        }

        .profile-avatar {
            width: 100%; height: 100%; border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 32px; background-size: cover;
            background-position: center; border: 2px solid var(--secondary);
        }

        .avatar-edit-icon {
            position: absolute; bottom: 0; right: 0;
            background: var(--primary); color: white;
            border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .avatar-edit-icon input[type=file] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        nav {
            position: fixed; bottom: 12px; left: 5%; width: 90%;
            background: rgba(15, 18, 30, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px; display: flex; justify-content: space-around;
            padding: 8px 0; z-index: 100;
        }

        nav button {
            background: none; border: none; color: var(--text-muted);
            font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px;
        }

        nav button i { font-size: 16px; }
        nav button.active { color: var(--secondary); font-weight: bold; }
    </style>
</head>
<body>

    <div class="animated-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header>
        <h2>منصة التوثيقات الحزبية</h2>
    </header>

    <div class="swiper-wrapper" id="swiper">
        
        <!-- الشاشة 1: الرئيسية -->
        <div class="screen-slide">
            <div style="font-weight: 700; color: var(--text-muted); margin-bottom: 10px;">
                <i class="fa-solid fa-globe"></i> منشورات جميع الأعضاء
            </div>
            <div id="allPostsContainer">جاري تحميل المنشورات...</div>
        </div>

        <!-- الشاشة 2: نشر صورة الجديدة -->
        <div class="screen-slide">
            <div class="card">
                <h3><i class="fa-solid fa-plus-circle" style="color:var(--secondary)"></i> نشر صورة جديدة</h3>
                
                <div class="upload-area">
                    <i class="fa-solid fa-camera" style="font-size: 28px; color: var(--secondary);"></i>
                    <p style="font-size:12px; margin-top:5px;">اضغط لاختيار صورة للمنشور</p>
                    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
                </div>

                <img id="preview" class="img-preview">

                <label>اسمك (تلقائي من البروفايل):</label>
                <input type="text" id="postAuthor" placeholder="اكتب اسمك هنا">

                <label>اسم الحزب:</label>
                <input type="text" id="postParty" placeholder="اكتب اسم حزبك هنا">

                <button class="btn-action" id="btnPublish" onclick="createPost()">نشر الآن على Vercel API</button>
            </div>
        </div>

        <!-- الشاشة 3: منشوراتي -->
        <div class="screen-slide">
            <div style="font-weight: 700; color: var(--text-muted); margin-bottom: 10px;">
                <i class="fa-solid fa-user-gear"></i> منشوراتي
            </div>
            <div id="myPostsContainer">جاري تحميل منشوراتك...</div>
        </div>

        <!-- الشاشة 4: البروفايل -->
        <div class="screen-slide">
            <div class="card" style="text-align: center;">
                <h3><i class="fa-solid fa-id-card" style="color:var(--secondary)"></i> تعديل البروفايل</h3>
                
                <div class="profile-avatar-container">
                    <div class="profile-avatar" id="profAvatar">أ</div>
                    <div class="avatar-edit-icon">
                        <i class="fa-solid fa-pen"></i>
                        <input type="file" accept="image/*" onchange="updateProfilePicture(event)">
                    </div>
                </div>

                <label>الاسم الكامل:</label>
                <input type="text" id="profNameInput" placeholder="أدخل اسمك الكريم">

                <label>اسم الحزب:</label>
                <input type="text" id="profPartyInput" placeholder="أدخل اسم الحزب">

                <button class="btn-action" onclick="saveProfileData()">
                    <i class="fa-solid fa-floppy-disk"></i> حفظ التغييرات
                </button>
                
                <p style="font-size: 12px; color: #00b894; margin-top: 15px;">
                    <i class="fa-solid fa-shield-check"></i> متصل بنجاح بـ Vercel Backend
                </p>
            </div>
        </div>

    </div>

    <nav>
        <button id="nav-0" onclick="goToSlide(0)" class="active"><i class="fa-solid fa-house"></i>الرئيسية</button>
        <button id="nav-1" onclick="goToSlide(1)"><i class="fa-solid fa-plus-circle"></i>نشر صورة</button>
        <button id="nav-2" onclick="goToSlide(2)"><i class="fa-solid fa-images"></i>منشوراتي</button>
        <button id="nav-3" onclick="goToSlide(3)"><i class="fa-solid fa-user"></i>بروفايلي</button>
    </nav>

    <script>
        let currentSlide = 0;
        let startX = 0;
        let isDragging = false;
        let allPostsFromDB = [];

        let userProfile = JSON.parse(localStorage.getItem('userProfile')) || {
            name: "عضو موثق",
            party: "حزب عام",
            avatar: ""
        };
        let selectedImageData = "";

        const swiper = document.getElementById('swiper');

        window.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        });

        window.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            let endX = e.changedTouches[0].clientX;
            let diffX = startX - endX;

            if (diffX > 50 && currentSlide < 3) goToSlide(currentSlide + 1);
            else if (diffX < -50 && currentSlide > 0) goToSlide(currentSlide - 1);
            isDragging = false;
        });

        function goToSlide(index) {
            currentSlide = index;
            swiper.style.transform = `translateX(${index * 25}%)`;
            
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`nav-${index}`).classList.add('active');

            if (index === 0) fetchPostsFromAPI();
            if (index === 2) renderMyPosts();
        }

        async function fetchPostsFromAPI() {
            try {
                const res = await fetch('/api/posts');
                const data = await res.json();
                if (data.success) {
                    allPostsFromDB = data.posts;
                    renderAllPosts();
                    renderMyPosts();
                }
            } catch (err) {
                console.log("خطأ في الاتصال بالـ API:", err);
            }
        }

        function loadProfileUI() {
            document.getElementById('profNameInput').value = userProfile.name;
            document.getElementById('profPartyInput').value = userProfile.party;
            document.getElementById('postAuthor').value = userProfile.name;
            document.getElementById('postParty').value = userProfile.party;

            const avatarDiv = document.getElementById('profAvatar');
            if (userProfile.avatar) {
                avatarDiv.style.backgroundImage = `url(${userProfile.avatar})`;
                avatarDiv.innerText = "";
            } else {
                avatarDiv.style.backgroundImage = "none";
                avatarDiv.innerText = userProfile.name ? userProfile.name.charAt(0) : "أ";
            }
        }

        function updateProfilePicture(event) {
            const reader = new FileReader();
            reader.onload = function() {
                userProfile.avatar = reader.result;
                loadProfileUI();
            }
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        function saveProfileData() {
            const name = document.getElementById('profNameInput').value.trim();
            const party = document.getElementById('profPartyInput').value.trim();

            if (!name) return alert("يرجى إدخال اسمك!");

            userProfile.name = name;
            userProfile.party = party;
            localStorage.setItem('userProfile', JSON.stringify(userProfile));

            loadProfileUI();
            alert("تم حفظ بيانات البروفايل!");
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('preview');
                output.src = reader.result;
                output.style.display = 'block';
                selectedImageData = reader.result;
            }
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        async function createPost() {
            const author = document.getElementById('postAuthor').value.trim() || userProfile.name;
            const party = document.getElementById('postParty').value.trim() || userProfile.party;

            if (!selectedImageData) return alert("اختر صورة أولاً لنشرها!");

            const btn = document.getElementById('btnPublish');
            btn.innerText = "جاري رفع الصورة للسحابة والـ API...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        author: author,
                        party: party,
                        userAvatar: userProfile.avatar,
                        imageBase64: selectedImageData
                    })
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('imageInput').value = "";
                    document.getElementById('preview').style.display = "none";
                    selectedImageData = "";
                    alert("تم نشر الصورة بنجاح على Vercel السحابي!");
                    await fetchPostsFromAPI();
                    goToSlide(0);
                } else {
                    alert("خطأ: " + data.message);
                }
            } catch (err) {
                alert("تعذر الاتصال بالسيرفر!");
            } finally {
                btn.innerText = "نشر الآن على Vercel API";
                btn.disabled = false;
            }
        }

        function renderAllPosts() {
            const container = document.getElementById('allPostsContainer');
            if (allPostsFromDB.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">لا توجد منشورات حية، اضغط نشر لإضافة أول صورة!</div>';
                return;
            }

            container.innerHTML = allPostsFromDB.map(p => {
                const avatarStyle = p.userAvatar ? `style="background-image: url('${p.userAvatar}');"` : '';
                const avatarText = p.userAvatar ? '' : (p.author ? p.author.charAt(0) : 'أ');

                return `
                <div class="post-card">
                    <div class="post-header">
                        <div class="user-info">
                            <div class="avatar" ${avatarStyle}>${avatarText}</div>
                            <div>
                                <div style="font-weight:bold; font-size:14px;">${p.author}</div>
                                <span style="font-size:10px; color:#00b894;"><i class="fa-solid fa-circle-check"></i> موثق</span>
                            </div>
                        </div>
                        <span class="post-party">${p.party}</span>
                    </div>
                    <img src="${p.image}" class="post-img">
                </div>
            `}).join('');
        }

        function renderMyPosts() {
            const container = document.getElementById('myPostsContainer');
            const myPosts = allPostsFromDB.filter(p => p.author === userProfile.name);

            if (myPosts.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">لم تقم بنشر أي صور باسمك الحالي.</div>';
                return;
            }

            container.innerHTML = myPosts.map(p => {
                const avatarStyle = p.userAvatar ? `style="background-image: url('${p.userAvatar}');"` : '';
                const avatarText = p.userAvatar ? '' : (p.author ? p.author.charAt(0) : 'أ');

                return `
                <div class="post-card">
                    <div class="post-header">
                        <div class="user-info">
                            <div class="avatar" ${avatarStyle}>${avatarText}</div>
                            <div style="font-weight:bold; font-size:14px;">${p.author}</div>
                        </div>
                        <span class="post-party">${p.party}</span>
                    </div>
                    <img src="${p.image}" class="post-img">
                </div>
            `}).join('');
        }

        loadProfileUI();
        fetchPostsFromAPI();
    </script>
</body>
</html>
